<!doctype html>
<html><head><meta charset="utf-8"><title>I172 scratch</title>
<style>body{font:16px system-ui;margin:0;padding:16px;background:#fff;color:#222} p:nth-child(3n){background:#e8f0ff} h2{color:#1a1a7a}</style>
<script src="i172-scratch.js"></script>
</head><body>
<input id="field" aria-label="Field" style="font-size:16px;width:300px">
<main id="main"></main>
<script>
const main = document.getElementById("main")
for (let i = 0; i < 200; i++) main.insertAdjacentHTML("beforeend", (i % 10 ? "" : `<h2>Section ${i / 10}</h2>`) + `<p>Paragraph ${i}:  some filler text so the page has ink on every line, with words, numbers ${i * 7} and more.</p>`)
</script>
</body></html>
