<p>
  Only the form's own docs page and tests used <code>validate-on</code>, so it's renamed with no alias. Its values
  follow: <code>submit</code> is <code>on save</code>, <code>blur</code> is <code>on leave</code>,
  <code>change</code> is <code>immediately</code>. The DOM element's property is <code>validateOn</code>, since
  <code>validate()</code> is its method; the component's own method became <code>validateFields()</code>.
</p>
