<p>T2: no new command. <code>spell lint</code> also checks a project's editor pages.</p>
<ul>
  <li>It checks each <code>*.editor.html</code> against the project's declarations.</li>
  <li>It lists one problem per line, like its other errors.</li>
  <li>A new <code>--fix</code> flag fixes them.</li>
</ul>
