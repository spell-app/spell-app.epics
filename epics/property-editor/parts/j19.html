<p>Gallop speed sets the length of her stride, in seconds: stride = 2 / (speed + 1).</p>
<ul>
  <li>Speed 1 is a 1 s stride, 4 is 0.4 s (her default), 10 is 0.18 s.</li>
  <li>The field shows it as <code>4 / 10</code> at the end of its label row.</li>
  <li>Her schema's help texts are <code>tip</code>s, so each shows as the field's info icon.</li>
</ul>
