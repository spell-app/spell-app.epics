<p>
  You asked for a button group (the Theme Creator's Corners). Spell UI's segmented <code>&lt;ui-menu&gt;</code> has no
  value a form can read or bind, so <code>as="buttons"</code> draws a row of <code>&lt;ui-radio&gt;</code>s for now. The
  fix: make the segmented menu a form control (<code>name</code>, <code>value</code>, form-associated), then point the
  <code>buttons</code> kind at it.
</p>
