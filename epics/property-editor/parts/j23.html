  <code>&lt;ui-form&gt;</code>'s messages fell back to the bare name (“name must have a value”). The form now asks a
  field for the label it shows (<code>shownLabel</code>): “Name must have a value”. Any
  <code>&lt;ui-field label&gt;</code> gains it too.
