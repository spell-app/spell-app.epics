<p>After <code>must match</code>, the text in quotes is read exactly as typed.</p>
<ul>
  <li>So <code>[a-z]</code> is a set of letters, and <code>\d</code> a digit.</li>
  <li>Why: elsewhere in spell's text, <code>[name]</code> fills in a value, so <code>"^[a-z]+$"</code> didn't parse.</li>
  <li>The grammar has a new kind of text for it, <code>pattern_text</code>.</li>
</ul>
