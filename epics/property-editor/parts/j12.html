<p>
  A type's schema comes from the running program's class only when the program the editor ran last is this project; else
  from its declarations file.
</p>
<ul>
  <li>Why: the runtime is one per page, and may still hold another project's <code>Card</code>.</li>
  <li>A class the program doesn't know (yet): the declarations too.</li>
</ul>
