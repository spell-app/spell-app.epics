<p>A property adds the control it draws to the form's light DOM, where the form finds and binds controls.</p>
<ul>
  <li>It's marked <code>data-ui-made</code>, the way <code>&lt;ui-repeat&gt;</code> adds rows.</li>
  <li>An empty editor likewise adds one <code>&lt;ui-property&gt;</code> per attribute.</li>
  <li>An author's own control or layout is never touched.</li>
</ul>
