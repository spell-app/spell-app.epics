<p>
  The form finds and binds controls in its light DOM, so a property adds the control it draws there (marked
  <code>data-ui-made</code>), as <code>&lt;ui-repeat&gt;</code> adds rows. An empty editor likewise adds one
  <code>&lt;ui-property&gt;</code> per attribute. An author's own control or layout is never touched.
</p>
