<p>Every fold fires the past-tense event once it has happened, whoever made it.</p>
<ul>

  <li>Only <code>ui-opening</code> / <code>ui-closing</code> are the person's, and cancelable.</li>
  <li>A docs page following folds listens to the past tense now.</li>
</ul>
