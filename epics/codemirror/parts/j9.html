<p>Why a copy:</p>
<ul>
  <li>
    Reading SpellModels' constants would import SpellModels, which brings Monaco into the CodeMirror chunk (the folder
    never imports Monaco).
  </li>
  <li>A browser test pinned them equal until P6 deleted SpellModels.</li>
  <li>CodeMirrorLanguage already kept such a copy before P2.</li>
</ul>
