<p>
  Owen's auto play draft (2026-11-17): <code>for each card in candidates ... return auto play</code> compiles to
  <code>await this.autoPlay()</code> with no <code>return</code>, so after the inner auto play ends the outer loop keeps
  going over its old list of candidates. <code>return move the card to end pile</code> keeps its return.
</p>
