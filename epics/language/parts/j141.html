<p>
  The app's <code>undo</code> and <code>redo</code> are described <code>refused_while_busy</code>, as JavaScript's:
  Python's page session drops them while an action runs, rather than queueing them to undo the move once it lands. ⌘Z on
  a page drawing a Python program runs the app's undo action there too.
</p>
