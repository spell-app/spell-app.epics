<p>
  A 'where' whose first words name the thing (<code>where the column is not empty</code>) filters the columns; anything
  else (<code>where the card ...</code>, <code>where it ...</code>, <code>which is face up</code>) filters each column's
  cards, before the pick. Both give the same cards; only the compiled code differs.
</p>
