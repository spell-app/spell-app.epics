<p>
  Solitario's <code>comodín</code> (a <code>carta</code> template) overrides <code>imagen</code> with
  <code>devolver "🃟"</code>. The TypeScript writer writes <code>get imagen(): Texte</code>:
  <em>Cannot find name 'Texte'</em>. Solitaire's joker gets <code>get picture(): string</code>. Inline
  <code>&lt;propiedad "imagen"&gt;"🃟"&lt;/&gt;</code> does the same. Solitario's tsc snapshot will hold it once blessed.
</p>
