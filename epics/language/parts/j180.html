<p>
  <code>core.holdWhile()</code> keeps a top-level step that WAITS out of the history (J150), and
  <code>runCreate()</code> a creation hook (I88). A plain top-level <code>put c in play</code> or
  <code>turn the card over</code> isn't held, so Undo is lit at start. None of the examples re-blessed calls one so, as
  far as their snapshots show.
</p>
