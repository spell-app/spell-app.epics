<p>
  Tic-Tac-Toe's board draws <code>onClick={play the square}</code>; <code>play it</code> is added by
  <code>&lt;spell-more-of "square"&gt;</code>. Written before the more-of (an earlier file, or earlier in the same
  file), it's Don't understand "play the square"; after it, it compiles. So the board sits after the more-of, in
  TicTacToe.spellml.
</p>
