  Owen's example, <code>if the result is ok, set the name of the baby to it</code>, doesn't parse: an <code>if</code> on
  one line takes <code>then</code> or <code>:</code>, not a comma. Built and tested with <code>then</code>. Reading the
  comma would be a new phrase, so it's left out: should a comma do what <code>then</code> does?
