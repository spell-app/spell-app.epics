<p>
  <code>for every card in the deck</code> and <code>add every card in the deck to the stock</code> read as
  <code>each</code> does. In Spanish I added nothing: <code>para cada carta del mazo</code> already reads, and
  <code>para toda carta del mazo</code> is grammatical but stilted, so a loop says <code>cada</code> only.
</p>
