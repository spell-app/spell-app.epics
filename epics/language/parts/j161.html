<p>
  <code>oculto</code> joins <code>en</code> (<code>slot</code>) in Spanish's attribute words, so
  <code>&lt;ui-button oculto&gt;</code> is <code>hidden</code> too. A hidden declaring tag draws nothing: no
  <code>h(...)</code>, and its <code>hidden</code> isn't a starting value of the new view. A non-declaring tag keeps
  <code>hidden: true</code>.
</p>
<epic-choices
  ><epic-option letter="A" title="Keep it" recommended></epic-option
  ><epic-option letter="B" title="Only on a declaring tag"></epic-option
></epic-choices>
