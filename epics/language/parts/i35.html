<p>
  <code>SX.CodeSpellWriter</code> on Tarea.es.spellml writes <code>&lt;dibujar&gt;</code> as
  <code>- para dibujar eso:</code>; that compiles <code>value={eso}</code> as <code>"prop:value": () =&gt; item</code>,
  not <code>value: this</code>. <code>- para dibujarla:</code> compiles the same as the spellml. The hand-kept twins in
  tests/spell/__spell__/ListaDeTareas say <code>dibujarla</code>.
</p>
