<p>
  In a method, <code>fijar y a "x [rango]"</code> compiles to <code>core.installStyles(undefined, `"x [rango]"`)</code>.
  <code>"x [su rango]"</code> and English <code>"x [stock]"</code> compile correctly.
</p>
<p>
  Cause: the fill-in glues the English <code>its</code> onto the words and reparses them (<code>TextLiteral</code>).
</p>
