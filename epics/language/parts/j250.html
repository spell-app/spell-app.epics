<p>
  <code>&lt;action ok /&gt;</code> runs the program's <code>ok</code> if it has one, else just closes, labelled OK.
  <code>&lt;action "ok" /&gt;</code> is still a quoted action name, refused when the program has none. The answer words
  sit in each language's word table, so a button's own word (T160's <code>&lt;action discard /&gt;</code>) can join
  them.
</p>
