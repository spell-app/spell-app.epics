<p>
  Chose to read the 24-hour <code>21:30</code> only in Spanish over English too, because English <code>9:30</code> alone
  could be morning or evening. English writes <code>9:30am</code> or <code>9:30 PM</code>. Minutes are two digits
  touching the colon: <code>9:05</code>, not <code>9 : 5</code>.
</p>
