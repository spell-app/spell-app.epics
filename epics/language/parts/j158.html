<p>
  Q63 made <code>top</code> a list's last item. <code>list_end</code>'s words follow, so
  <code>add x to the top of the deck</code> is <code>core.append(...)</code> (was prepend) and
  <code>to the bottom of</code> is <code>core.prepend(...)</code>; Spanish <code>arriba</code> / <code>abajo</code> the
  same. <code>top 2 cards of the deck</code> is its last two. Nothing in the examples used the old meanings.
</p>
<epic-choices
  ><epic-option letter="A" title="Keep it" recommended></epic-option
  ><epic-option letter="B" title="Leave list_end as it was"></epic-option
></epic-choices>
