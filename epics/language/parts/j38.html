<p>
  Chose <code>&lt;ui-defaults&gt;</code> in Spanish files too, over a Spanish word
  (<code>&lt;es-predeterminados&gt;</code>), because it's a Spell UI tag like <code>&lt;ui-button&gt;</code>, which
  Spanish files write as is. The language's <code>defaultsTag</code> word holds it, so a translation can change it
  later.
</p>
