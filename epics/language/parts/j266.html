<p>
  <code>show_drawn_with</code> is a rule of its own, as it declares the new <code>it</code>. Chose that over one rule
  because <code>... without waiting</code> takes only a call that declares nothing: plain
  <code>show "you won" without waiting</code> still works;
  <code>show "edit card" with the card without waiting</code> doesn't parse.
