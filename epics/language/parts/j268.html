<p>
  The Python writer wrote a group of statements inside a function as the module's top level, so a waiting call in one
  became <code>asyncio.run(...)</code>. Fixed: a group is the top level's only at the top.
  <code>show ... with ...</code> needed it; <code>deal the cards without closing</code>, when the action waits, had the
  same bug.
</p>
