<p>
  Spanish's <code>cada</code> also means 'every': Solitario's
  <code>la primera pila en cada pila donde puede tomar la carta</code> is the first pile of every pile, and read as one
  of each it broke. So the pick is <code>of</code> / <code>from</code> each in English, <code>de</code> /
  <code>del</code> cada in Spanish; <code>in each</code> / <code>en cada</code> read as before.
</p>
