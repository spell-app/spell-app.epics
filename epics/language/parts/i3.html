<p>
  From reading the code, not run: a declaration's <code>waits</code> looks only at the action's own body, while Python's
  project-wide answer includes what it calls. So a project importing <code>bump later</code> would call an
  <code>async def</code> without waiting, and it would do nothing.
</p>
