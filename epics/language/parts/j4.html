<p>
  <code>core.send()</code> is always asynchronous, so listing it as slow would make every sender wait. The pass joins
  <code>send hit</code> to <code>onHit</code> by name, and the sender waits only if one of those waits.
</p>
<epic-net-effect
  ><ul>
    <li>An event nobody handles slowly adds no waiting to the action sending it.</li>
  </ul></epic-net-effect
>
