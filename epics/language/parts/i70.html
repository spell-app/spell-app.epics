<p>
  Only the tag tokenizer read any letter in an element's name; plain Spell's (<code>Tokenizer.JSX_TAG_START</code>) read
  ASCII alone, so Caja de Recetas and Lista de Tareas lost their buttons and text areas when converted. Both read any
  letter now. Fixed in P46.
</p>
