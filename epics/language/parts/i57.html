<p>
  Found in I18: <code>font="title-caps"</code> now capitalises a header's, button's or label's words on screen, but only
  the look. A program that wants the text itself in title case (to save, or compare) has no
  <code>as title case</code> beside <code>as upper case</code>.
</p>
