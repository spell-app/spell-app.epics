<p>
  Built <code>is this morning</code> / <code>es esta mañana</code> (any day part: <code>this afternoon</code>,
  <code>esta noche</code>) over leaving <code>esta mañana</code> out, because it fell out of the day-part check: the
  same part, and the date must be today. English also takes <code>is at night</code> beside
  <code>is in the night</code>.
