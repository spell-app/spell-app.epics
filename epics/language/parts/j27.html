<p>
  <code>172 cm</code> in feet and inches is <code>5 ft 8 in</code>; 77 kg in pounds is <code>170 lb</code>; 2.54 cm
  stays <code>2.54 cm</code>. A unit is written by its first <code>aka</code> (<code>cm</code>, <code>°F</code>), else
  its name. The same in Python's core, which has no <code>Intl</code>, so neither uses it yet; P24 decides the reader's
  units.
</p>
