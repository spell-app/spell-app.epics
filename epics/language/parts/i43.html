<p>
  In Tic-Tac-Toe, <code>clear the mark of the square</code> (and <code>clear the square's mark</code>) compile to
  <code>core.clear(square.mark)</code>, which throws <i>Cannot delete property '0' of [object String]</i> at run time;
  <code>clear its winner</code> on the app's own text compiles to <code>this.winner = ""</code>. Worked round with
  <code>set the square's mark to ""</code>.
</p>
