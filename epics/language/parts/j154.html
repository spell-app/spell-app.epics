<p>
  <code>a "column" is a pile with layout "vertical"</code> compiles <code>get layout() { return "vertical" }</code>,
  exactly as <code>its "layout" is vertical</code> in its body. <code>with layout "vertical"</code> (no <code>=</code>)
  reads only for a property a type declares; any other needs <code>=</code>, and an unknown one is an error naming it.
</p>
