<p>
  <code>the names of the piles</code> now reads each pile's name (I155). The possessive form,
  <code>the piles' names</code>, is another rule (<code>PossessiveProperty</code>) and still compiles to
  <code>core.everyThing(Pile).names</code>, a member the list doesn't have.
</p>
