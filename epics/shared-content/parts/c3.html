<p>
  These sessions have no Grep / Glob tools. <code>grep -r</code> and plain <code>rg</code> skip linked folders;
  <code>grep -R</code> follows them, <code>rg</code> needs <code>-L</code> (and the links are gitignored, so
  <code>rg</code> also needs <code>--no-ignore-vcs</code> or a root <code>.ignore</code>).
</p>
