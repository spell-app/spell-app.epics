  merged <code>main</code> (after claude-design is in it): <code>spell dev plan-doc split &lt;name&gt;</code>, then
  <code>spell dev plan-doc check &lt;name&gt;</code>. <code>split --done</code> picks up the finished ones with no
  worktree by itself.
