<p>
  <code>spell static page.html</code> (<a
    href="../../../packages/cli/src/commands/staticCommand.ts"
    target="src-packages-cli-src-commands-staticcommand-ts"
    ><code>staticCommand.ts</code></a
  >) starts a child process that loads
  <a href="../../../packages/ui/tools/StaticDocument.ts" target="src-packages-ui-tools-staticdocument-ts"
    ><code>StaticDocument</code></a
  >
  through an SSR-only Vite server (<a href="#d49">D49</a>). Then, in order:
</p>
<ui-steps class="spell-steps" ordered vertical size="small">
  <ui-step
    header="Prepare"
    description="StaticRender.prepare(html):  icon packs, then each family's static preload(html) (emoji names, Temporal for calendars):  data loads async, the render is sync"
  ></ui-step>
  <ui-step
    header="Parse"
    description="linkedom reads the page;  every ui-* element of a StaticCatalog family gets a stand-in host (ServerHost):  attributes through the fork's converters, a parent / children view, a state slot"
  ></ui-step>
  <ui-step
    header="Build controllers, owners first"
    description="items need their list, tab buttons their panes, a section's heading level its parent:  every controller exists before any renders;  memos that read other controllers are lazy (D25)"
  ></ui-step>
  <ui-step
    header="Render"
    description="renderToString per element (Solid compiled with generate: ssr), against ServerRuntime:  English texts, page-wide ids that skip the page's own, browser.supports all false;  hostEffect() applies host ARIA at once"
  ></ui-step>
  <ui-step
    header="Flatten"
    description="StaticFlattener:  host -> its root;  slots -> the assigned children (data-ui-slotted);  states -> data-state (in-* also classes);  internals ARIA -> attributes;  ids to the native control;  list items -> <li>;  <div> in phrasing content -> <span>;  data-ui=<kind> on each root"
  ></ui-step>
  <ui-step
    header="Interactions"
    description="StaticInteractions:  custom commands -> native (show-modal, toggle-popover ...), dialog closers get command=close, click popups popovertarget, repeated ids renamed"
  ></ui-step>
  <ui-step
    header="Page styles"
    description="StaticPageStyles rewrites the page's <style>s:  ui-card -> [data-ui=card], ::part(), :state(), every subject kept out of component internals (REACH)"
  ></ui-step>
  <ui-step
    header="Document"
    description="StaticDocument:  local linked sheets inlined, rewritten (D59);  element scripts dropped (D51);  the stylesheet linked FIRST in <head> (D52)"
  ></ui-step>
  <ui-step
    header="Stylesheet"
    description="StaticStylesheet.build():  foundation, reset, then each used family's sheets rewritten for light DOM and wrapped in @scope, in adoption order (D19);  minified by Lightning CSS (D53)"
  ></ui-step>
</ui-steps>
