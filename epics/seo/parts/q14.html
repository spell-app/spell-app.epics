<epic-answer id="d14" title="List item wrappers: display: contents, child combinators step over them"
  ><p>
    <code>&lt;li data-ui-li&gt;</code> is <code>display: contents</code> (the card stays the flex child), the slotted
    marker goes on the item's root, and in the sheets of cards / list / feed / steps / items each
    <code>A &gt; B</code> also matches <code>A &gt; [data-ui-li] &gt; B</code> (at most 3 per selector: 2^n variants).
  </p></epic-answer
>
