<p>
  chose a child process (like <code>spell run</code> / <code>spell speedtest</code>) over an in-process Vite server because
  the CLI silences <code>console.*</code> (Vite's warnings and errors would vanish), and the server render installs a
  <code>UI</code> runtime and Solid's server build state on <code>globalThis</code>. Cost: one extra node start (~0.3
  s).
</p>
