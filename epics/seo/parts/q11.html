<epic-answer id="d11" title="ServerRuntime, not UIRuntime, in node"
  ><p>
    <code>UIRuntime</code>'s constructor registers the foundation with <code>new CSSStyleSheet()</code>.
    <code>ServerRuntime</code> installs the real <code>browser</code>, <code>ids</code>, <code>i18n</code>,
    <code>vocabulary</code>, <code>icons</code> and a no-op <code>styles</code>; any other service throws, naming
    itself.
  </p></epic-answer
>
