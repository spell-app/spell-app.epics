<p>
  <code>UIButton.render()</code> always writes <code>type="button"</code> (it submits through
  <code>internals.form</code> on click in a browser). In a static page that click does nothing, so
  <code>ui-form/types</code>' Submit button can't submit. Fix (button family): on a server,
  <code>type={this.attrs.type ?? "button"}</code> for <code>submit</code> / <code>reset</code>.
</p>
