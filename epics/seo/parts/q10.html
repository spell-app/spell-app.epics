<epic-answer id="d10" title="hostEffect(): host-writing effects apply at once on a server"
  ><p>
    Solid's server build runs an effect's compute only, never its apply, so host ARIA (<code
      >internals.role = "listitem"</code
    >) was never set. <code>UIElement.hostEffect(compute, apply)</code> ~== <code>createEffect</code> in a browser,
    applies once on a server. Used in <code>UIItem</code>, <code>UICard</code>; the rest in <a href="#p3">P3</a>.
  </p></epic-answer
>
