<epic-answer id="d20" title="A <div> list item root becomes the <li>; only <article> / <a> / <button> roots are wrapped"
  ><p>
    Refines <a href="#d4">D4</a> / <a href="#d14">D14</a>: a wrapper hides an item's siblings, so
    <code>:first-child</code> and <code>.item + .item</code> broke (every list item got the first item's padding).
    Wrapped roots remain (cards, link items): their position pseudo-classes are tested on the wrapper (<code
      >StaticSelectors.hostPosition()</code
    >
    / <code>wrapperPosition()</code>).
  </p></epic-answer
>
