<epic-answer id="d15" title="Host-only rules move to @layer ui.reset"
  ><p>
    A host rule (<code>:host { --ui-color: initial }</code>) and the root's own rule (<code>.ui.red</code>, in
    <code>ui.tokens</code>) were on different elements; now they share one, so the host rule moves to the first layer
    and every later layer still wins. Their <code>display</code> is dropped (the host box's).
  </p></epic-answer
>
