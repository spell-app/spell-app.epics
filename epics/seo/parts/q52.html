<epic-answer id="d52" title="P5: the static stylesheet is linked FIRST in <head>"
  ><p>
    Before the page's own <code>&lt;link rel=stylesheet&gt;</code> / <code>&lt;style&gt;</code>: its
    <code>@layer ui-slotted, page, ui;</code> must set the layer order before a page sheet names a
    <code>ui.*</code> layer. The docs'
    <a href="../../../packages/docs/tools/_assets/spell-doc.css" target="src-packages-docs-tools-assets-spell-doc-css"
      ><code>spell-doc.css</code></a
    >
    starts <code>@layer ui.reset, ui.tokens ...</code>: linked after it, <code>page</code> would land after
    <code>ui</code>.
  </p></epic-answer
>
