<p>Two parts of Fomantic's Amazon theme can't be done from a theme sheet.</p>
<ul>
  <li>
    The page's minimum width and its 1049px breakpoints: <code>@custom-media</code> breakpoints are inlined at build
    time (<a href="../../../packages/ui/src/styles/media.css" target="src-packages-ui-src-styles-media-css"
      ><code>media.css</code></a
    >), so no sheet can move them.
  </li>
  <li>
    <code>@linkHoverUnderline</code> is moot:
    <a href="../../../packages/ui/src/styles/typography.css" target="src-packages-ui-src-styles-typography-css"
      ><code>typography.css</code></a
    >
    always underlines.
  </li>
</ul>
