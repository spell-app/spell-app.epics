<p>Fomantic's basic theme ships its own icon FONT and glyph map; ours draws icons as SVG.</p>
<ul>
  <li>
    Our icons are SVG packs drawn by <code>&lt;ui-icon&gt;</code>, so a basic icon look would be an icon pack, not a
    theme sheet.
  </li>
  <li>The spacing in <code>icon.overrides</code> targets <code>i.icon</code> markup we don't render.</li>
</ul>
