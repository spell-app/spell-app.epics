<p>
  P6 covers the two read paths of a space's folder: through Spell's server (<code>FolderPlace</code>) and read direct
  (<code>DirectReads</code>). A <code>Referee</code> room keeps its own copy of the rows, and the editor's
  <code>/spaces/&lt;address&gt;/...</code> file route reads a folder's files as a project's; neither asks
  <code>Takedowns</code> yet.
</p>
