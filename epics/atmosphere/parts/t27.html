<p>A status Spell writes is keyed by its thing's id (<code>status-k3x9q2mf</code>), not a TID.</p>
<ul>
  <li>The PDS takes it: it doesn't check a Lexicon it doesn't know.</li>
  <li>But Statusphere's own app may skip it.</li>
  <li>A type published as a Lexicon whose key is <code>tid</code> should make TID ids.</li>
</ul>
