<p>
  A status Spell writes is keyed by its thing's id (<code>status-k3x9q2mf</code>). The PDS takes it (it doesn't check a
  Lexicon it doesn't know), but Statusphere's own app may skip it. A type published as a Lexicon whose key is
  <code>tid</code> should make TID ids.
</p>
