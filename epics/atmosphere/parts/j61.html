<ul>
  <li>
    A <code>Referee</code> holds the collections it's opened with, so a space's room is one per collection, made as the
    first page joins.
  </li>
  <li>
    Joining is reading: only someone who may read the space joins; someone taken off the list while in a room is refused
    their next write, but hears the room until they leave.
  </li>
</ul>
