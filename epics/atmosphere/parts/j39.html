<p>
  Standard.site checks a document is the page's own by a
  <code>&lt;link rel="site.standard.document" href="at://..."&gt;</code> in the page's head, so after publishing the
  command adds that tag (replacing an older one). <code>--no-link</code> leaves the page alone.
