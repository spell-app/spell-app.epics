<p>
  Adding a member as <i>member</i> writes <i>editor</i>; a space's owner is written in as <i>manager</i>. A file that
  already says <i>guest</i>, <i>member</i> or <i>admin</i> isn't rewritten: it's read as viewer, editor and manager
  every time. The people library still lists the old three, after the new ones, so those files stay valid.
</p>
<epic-choices
  ><epic-option letter="A" title="Leave old files alone" recommended></epic-option
  ><epic-option letter="B" title="Rewrite them once"></epic-option
></epic-choices>
