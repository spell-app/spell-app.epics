<p>
  After the switch, a worktree that hasn't merged <code>main</code> yet, serving docs on its OWN page server, has no
  <code>epic-*</code> elements.
</p>
<p><b>Net effect:</b></p>
<ul>
  <li>
    the side bar uses <code>main</code>'s server, so you see them drawn; only that worktree's own server (a browser tab
    on its port) shows them undrawn until it merges <code>main</code>
  </li>
</ul>
