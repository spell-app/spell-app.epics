<p>
  <code>spell spellx convert</code> turns <code>its "height" is a number</code> into
  <code>&lt;property "height" type="number"/&gt;</code>; with <code>or "unknown"</code> or <code>stored as "x"</code> it
  now leaves the line as Spell, since no attribute says them yet. Chose that over new attributes
  (<code>nothing-as=</code>, <code>stored-as=</code>), which want their own words in both languages.
</p>
