<p>
  The catalog and settings are copied as asked; <code>yarnPath: .yarn/releases/yarn-4.18.0.cjs</code> is left out: the
  release lives once, in the top repo, and a child repo's yarnPath would name a file it doesn't have, which stops yarn
  there. <code>packageManager: yarn@4.18.0</code> stays in each package.json.
</p>
