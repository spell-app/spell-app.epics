<p>
  A property a type never declares, but a <code>set</code> gives a value, is declared at the top of its file. Its
  comment is the line that set it.
</p>
<ul>
  <li>e.g. <code>// set the pile of the card to the pile</code>, above <code>Card.declareProp("pile", ...)</code></li>
</ul>
<epic-net-effect
  ><ul>
    <li>Every property says where it came from, even one nobody declared.</li>
  </ul></epic-net-effect
