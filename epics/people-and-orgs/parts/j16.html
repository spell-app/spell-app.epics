<p>
  <code>Saver().save()</code> returns <code>Saved</code>, a dataclass with <code>root</code> and <code>entries</code> (a
  dict, in the order reached), over a plain dict like JavaScript's <code>{ root, entries }</code>, because Python reads
  <code>saved.root</code> as JavaScript does. It's exported from <code>spell_core</code> beside <code>Saver</code> and
  <code>Loader</code>.
</p>
