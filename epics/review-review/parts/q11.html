<epic-answer id="d10" title="Reloads update the page in place instead of splitting it into includes"
  ><ul>
    <li>
      On a change the page fetches its new version and swaps in only what changed: no reload, so scroll, folds and a
      half-typed note survive.
    </li>
    <li>
      Not &lt;ui-include&gt; pieces: those need the page server (blank when opened from disk), arrive after the contents
      list is built, and turn one doc into many files.
    </li>
  </ul></epic-answer
>
