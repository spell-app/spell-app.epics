<epic-answer id="d16" title="Case-insensitive literals: /i after a keyword or choice, e.g. (note|tip)/i"
  ><p>
    Owen's idea, <code>{xxxx}/i</code>, regex-style. Scope: a keyword (<code>note/i</code>) or a choice of literals
    (<code>(note|tip)/i</code>). Not a <code>{subrule}</code>: what it matches is that rule's business, so
    <code>{x}/i</code> is an error. <code>/</code> is only a flag directly followed by <code>i</code>; spell's
    <code>(operator:/|divided by)</code> is untouched.
  </p></epic-answer
>
