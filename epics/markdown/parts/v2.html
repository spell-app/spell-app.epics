<p>
  In a <code>.spell</code> file, a comment like <code># a **b** *c* `d` [e](f)</code>: <code>**b**</code> bold,
  <code>*c*</code> italic, <code>`d`</code> in the string colour, <code>[e](f)</code> underlined, the rest in the
  comment colour.
</p>
