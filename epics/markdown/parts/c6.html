<p>
  Rulex reads its syntax with spell's tokenizer, so: <code>#</code> at the start becomes a heading comment (throws);
  <code>--</code> / <code>//</code> anywhere become comments (silently dropped, <a href="#i1">I1</a>);
  <code>"..."</code> / <code>'...'</code> become text; <code>&lt;b&gt;</code> becomes JSX. Workarounds that work today:
  <code>\#</code>, <code>\-\-\-</code>, <code>\/\/</code>.
</p>
