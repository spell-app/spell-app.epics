<p>
  The walk runs each <code>sh</code> block with <code>bash</code>, stdin closed, stdout and stderr as one stream, under
  <code>set -eo pipefail</code> (any failing line fails the block). Closed stdin keeps a command from fighting the walk
  for the keys; NetBox's commands ask nothing (<code>--no-ai</code>).
</p>
