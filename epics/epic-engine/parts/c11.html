<p>
  The exclude line (<code>/.ignore</code>) goes in the repo's shared <code>info/exclude</code>, which every worktree
  reads.
</p>
<ul>
  <li>
    Harmless where the file is tracked (<code>main</code>, a merged branch): git ignores excludes for tracked files.
  </li>
  <li>The catch: a branch that wants to ADD that file itself needs <code>git add -f</code>.</li>
</ul>
