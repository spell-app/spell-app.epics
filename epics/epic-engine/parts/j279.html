<p>
  Each step file holds plain <code>epic</code> command lines, quoted as a shell quotes them, so Owen can rewrite them.
  <code>sh</code> only reads them; <code>epic demo run</code> then runs each one itself.
</p>
<p>
  Why: starting a new <code>epic</code> for each command made step 06 (14 commands) take 30 seconds; in one process it
  took 13 on a busy machine.
</p>
