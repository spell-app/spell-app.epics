<p>
  A compiled program isn't a Python package, so a relative import fails. <code>spell compile --target py</code> copies
  <code>clipboard.py</code> beside the compiled program; <code>spell run --target py</code> puts its folder on Python's
  import path, as it does for imported projects.
</p>
