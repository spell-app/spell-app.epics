<p>
  <code>showColumn()</code> never scrolls past the box's own end (<code>scrollWidth - clientWidth</code>), where a
  detail pane's end snaps. This applies to every tree in columns, with or without a pane: before P6 it could ask for a
  scroll past the end, which the browser clamped anyway.
</p>
