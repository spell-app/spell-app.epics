<p>
  For <code>a ui tree view</code>, compiled TypeScript writes <code>NetlistColumnElement extends SpellElement</code> and
  calls <code>core.useElement()</code> with it. The page builds the tag on <code>&lt;ui-tree&gt;</code> instead, so that
  class is never used. Its TypeScript writer should skip it.
</p>
