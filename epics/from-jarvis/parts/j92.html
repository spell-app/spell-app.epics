<p>
  The kit's reader (<code>readTypeScript()</code>) is node only. In a browser, <code>SP.NativeCode</code> reads lines
  starting <code>export function</code>, <code>export async function</code> and
  <code>export const name = (...) =&gt;</code>. The <code>spell</code> command loads
  <code>spell/parser/spell/node/nativeExports</code>, which swaps in the syntax-tree reader.
</p>
