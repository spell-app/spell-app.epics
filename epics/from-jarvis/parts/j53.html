<p>
  From markup, rows marked <code>open</code> / <code>selected</code> are the page's own path, so the kept one is left
  alone. Opening the kept path is like a page setting <code>path</code>: no event; the pane's element gets the pick as
  its <code>item</code> property anyway, which is how the docs example's <code>&lt;ui-json&gt;</code> follows it.
</p>
