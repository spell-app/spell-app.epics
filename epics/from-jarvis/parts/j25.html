<ul>
  <li>
    The row grid (parts lined up down a column) is only for rows from <code>items</code>: markup rows each sit in their
    own shadow root, which a grid can't reach across.
  </li>
  <li><code>rowClass(item)</code> too: a subclass's sheet can't reach a markup row's shadow root.</li>
</ul>
