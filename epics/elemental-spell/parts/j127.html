<p>
  A one-of value can't be quoted inside an attribute, and a bare <code>done</code> reads as the task's alias
  <code>is done</code>. So the checklist has an alias, <code>alias="is showing (showing)"</code>, and the app's property
  was renamed from <code>tasks</code> to <code>checklist</code> to read in the singular.
</p>
