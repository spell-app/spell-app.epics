  <li>
    Spell reads only double-quoted strings (an apostrophe is a possessive), and a spellx tag head's value ends at the
    first ". The JSX tokenizer takes \", and the compiled value keeps the quote
  </li>
  <li>e.g. description="`icon-position=\"right\"` puts the icon after the text ..."</li>
</ul>
