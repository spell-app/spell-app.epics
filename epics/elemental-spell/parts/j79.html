<p>
  The switch sits in the code editor's toolbar, only for a <code>.spellx</code> file; the browser remembers the pick
  (<code>spellEditor:inputView</code>). Each file remembers its own open cards and scroll
  (<code>spellEditor:notebook:&lt;path&gt;</code>). The other way, a choice per file, adds a pref per file for little
  gain.
</p>
