<p>
  On a page whose program runs elsewhere (<code>core.remote</code>), a mouse event still calls the thing's own handler
  by name: no chain, no <code>pass</code>. The Python core has no <code>send</code> or <code>input</code> yet; they're
  listed in its not-ported list.
</p>
