<ul>
  <li>Spell UI's: <code>ui-</code> plus the hyphenated word (<code>ui-save-failed</code>, <code>ui-in-view</code>).</li>
  <li>
    spell-epic's, the editor's and the site's keep the thing they're about: <code>epic-thread-opened</code>,
    <code>spell-site:navigated</code>, <code>spell-server:changed</code>.
  </li>
  <li>Why: their listeners sit on the document and tell them apart by name alone.</li>
</ul>
