<p>
  In <code>&lt;if ...&gt;</code> heads and <code>{holes}</code>, a <code>&gt;</code> or <code>}</code> inside
  <code>"..."</code> is text (Q45), but <code>'</code> is not a quote: spell writes <code>{the score's time}</code>. An
  attribute's value may still be single-quoted, as in HTML.
</p>
