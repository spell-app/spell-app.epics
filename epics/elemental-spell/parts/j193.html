<p>
  JSON is JSON in Spanish, so <code>&lt;json&gt;</code> in both languages. In spell, <code>json</code>,
  <code>ui-json</code> and <code>es-json</code> are raw-text tags, as <code>markdown</code> is. An old-style
  <code>&lt;script type="application/json"&gt;</code> works inside one, for JSON holding a <code>&lt;</code> on a plain
  HTML page.
</p>
