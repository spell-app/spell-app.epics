<p>
  J6: a part's element carries <code>part="front"</code> (added to any part names it says,
  <code>part="face front"</code>), so <code>::part(front)</code> styles its real box. Added at compile time to a drawn
  markup line or a quoted part's markup; NOT to an explicit <code>return &lt;x/&gt;</code>, nor to a fragment, which has
  no element.
</p>
