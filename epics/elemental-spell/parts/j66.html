<p>
  <code>- when flipped:</code> compiles as <code>- on flipped:</code> does, <code>onFlipped(event)</code>.
  <code>- when created:</code> stays the creation hook: it wins on those words by priority. A handler method is looked
  up as <code>on&lt;Name&gt;</code>, then <code>when&lt;Name&gt;</code>.
</p>
