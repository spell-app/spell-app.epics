<p>Owen, 2026-10-24: "<code>cancel closing| event</code>".</p>
<ul>
  <li>
    A handler of a cancellable event stops it with <code>cancel &lt;event name&gt;</code>, or just
    <code>cancel event</code>.
    <epic-code title="a dialog that won't close with unsaved changes" language="spell">
      <pre>
- on closing:
	if it has unsaved changes:
		cancel closing</pre>
    </epic-code>
  </li>
  <li>
    Only the "-ing" half of a pair can be cancelled: <code>send closing</code> can be, <code>send closed</code> can't.
  </li>
</ul>
