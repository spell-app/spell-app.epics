<ul>
  <li>The tag: <code>espacio</code>.</li>
  <li>
    Its attributes are words other tags already translate, once for every tag: <code>inline</code>
    <code>en-linea</code>, <code>width</code> <code>ancho</code>, <code>height</code> <code>alto</code>,
    <code>fluid</code> <code>fluido</code>.
  </li>
  <li>
    The space words (<code>xs</code> ... <code>xl</code>) stay as they are, as
    <code>&lt;es-pila separacion&gt;</code> takes them.
  </li>
</ul>
