Source maps are made for the javascript-family targets (js/solid, ts/solid, ts/lib). Python's writer (PY.PyWriter) is
not a P.JSWriter, so no marks are made for it. Python has no standard source-map format for tracebacks; a line table
beside the .py could do it later.
