<p>
  Seen in C28's pairs, older than it: <code>&lt;ui-text&gt;{its moves} moves&lt;/ui-text&gt;</code> compiles to
  <code>h("ui-text", () =&gt; this.moves, "moves")</code>, the text's leading space gone, so the page shows
  <code>3moves</code>. JSX keeps that space. Not fixed in C28.
</p>
