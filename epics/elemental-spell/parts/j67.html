<p>
  A key pressed sends <code>key down</code> with <code>key</code> (its name, lowercase: <code>a</code>,
  <code>enter</code>, <code>arrowup</code>) to the thing whose view has the focus, then up its chain, else the app (Q35
  B). Mouse events go to the innermost thing under the mouse. No <code>key up</code> event yet:
  <code>the space key is down</code> reads it anywhere.
</p>
