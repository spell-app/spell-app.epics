<p>
  Typed <code>&lt;accion</code>, <code>descripcion=</code>, <code>&lt;/accion&gt;</code>: each becomes
  <code>acción</code> / <code>descripción</code> as you type, from the language's spellx word tables.
</p>
<ul>
  <li>A plain spelling that is another word of its own is left alone; one that could be two accented words is too.</li>
</ul>
