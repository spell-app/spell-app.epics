ts/solid writes Project.spell.tsx.map for the .tsx. buildTsx() compiles that with Solid's JSX transform without chaining
the map, so spell run on the TSX target shows built lines in stack traces (runCommand passes no map for TSX). The JS
target is fully mapped.
