<p>
  A <code>title</code> on an element makes the browser draw its own tooltip for the whole element, and it would name a
  whole subtree. So the tag says <code>hover-text</code>, which becomes the box's SVG <code>&lt;title&gt;</code>. JSON
  keeps <code>title</code>.
</p>
