<p>
  A pack that is a whole checkout (<code>spellPack.dir: "src"</code>) hashes everything under src/, so a change to
  command/ or config/ fails tests/pack.test.ts until <code>yarn pack:build</code>, which only rewrites the hash line.
  Narrow the hash to src/components/ (and what the elements import).
</p>
