<p>
  With spell-epic's plugin and extension on: <code>epic window open &lt;name&gt;</code> then
  <code>handoff &lt;name&gt; --prompt continue</code>; at the turn's end the session opens in the worktree's window and
  its old tab closes. The registry files are in <code>~/.spell-epic/windows/</code>.
</p>
