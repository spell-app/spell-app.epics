<p>
  With the window bridge gone, nothing needs it running in every window: <code>activationEvents</code> is
  <code>onLanguage:spell</code> (no <code>onStartupFinished</code>, no <code>onUri</code>), and
  <code>activate()</code> starts the language server straight away. Its commands are all enabled only in a spell editor,
  so nothing else needs it awake.
</p>
