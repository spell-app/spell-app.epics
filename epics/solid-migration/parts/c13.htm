<p>
  Each <code>loadMonaco()</code> adds its own <code>SpellMonaco.onEdit</code> / <code>onOpen</code> listener. While both
  are loaded, an edit calls <code>editor.onFileEdited()</code> twice (harmless: <code>compileAppSoon()</code> restarts
  one timer) and the latest opener wins. Goes away when React's <code>UI.LazyMonaco</code> does (P8).
</p>
