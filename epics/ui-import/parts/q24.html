  id="d24"
  title="The page server serves a script's fetch() (Sec-Fetch-Dest: empty) the file AS IS: no injected live-reload tags"
  ><p>
    Found while wiring the save: every served <code>.html</code> gets <code>window.SPELL_SERVER</code> and
    <code>/_server/live.js</code> injected, so an include would have shown them and a save would have written them into
    the file. Navigations, scripts and module imports still get the hooks.
  </p></epic-answer
