  title="Docs pages keep the engines lazy: each is its own classic script, _assets/lazy/<name>.js, which UI's loader hooks (CodeHighlighter.engineLoader, MarkdownRenderer.engineLoader, SpellLanguage.bundleLoader) load on first use"
