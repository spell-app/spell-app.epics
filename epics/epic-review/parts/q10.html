<epic-answer
  id="d10"
  title="Review commands edit the epic's live doc: its own worktree, else main, else any worktree; never this checkout's copy"
  ><p>
    Every worktree holds a COPY of every merged epic from when it branched. Marking reviewed in that copy would fork the
    record. So review / defer / queue / unqueue / items look up the doc (findDoc()), while add / close / phase etc.
    still edit this checkout's.
  </p></epic-answer
>
