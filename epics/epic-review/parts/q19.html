<epic-answer
  id="d19"
  title="Every plan-doc command but new edits the epic's live doc (its worktree, else main), not just the review commands"
  ><p>
    A review decides, closes and adds items too. From main, reviewing an epic still in its worktree, decide / close /
    add would have failed (no doc there), or, from another worktree, edited the stale copy it took of a merged epic. An
    epic's own session is unaffected: its own worktree comes first.
  </p></epic-answer
>
