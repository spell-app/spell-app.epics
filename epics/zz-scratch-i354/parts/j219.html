<p>
  The bubbly look colours a band by part of speech, not by type, so every view's band is the thing purple
  (--bubbly-thing) and every Spell UI tag's is the structure blue (--bubbly-structure). The tags follow that. A colour
  per type would need a palette the code doesn't have.
</p>
