  Bill Splitter adds the amounts with a loop, and writes dollars and cents with its own phrase,
  <code>to write (amount as a number) as money</code>, from <code>round</code> and <code>as an integer</code>. Words
  like <code>the total of the amounts in its diners</code> and <code>x as money</code> /
  <code>to 2 decimal places</code> would shorten it.
