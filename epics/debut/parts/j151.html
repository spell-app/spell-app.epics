<p>
  A passive <code>when</code> is its event by meaning (Q47), so
  <code>LayoutSpell.handlersIn("when clicked: ...")</code> gives event <code>click</code>, not <code>clicked</code> (and
  <code>double-click</code> for <code>when double clicked</code>). The DOM event is the same; its test says the new
  names.
</p>
