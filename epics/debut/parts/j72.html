<p>
  The square comes from no side padding and a width as big as its height. The round shape is the theme's: the docs
  page's Spell theme makes buttons pills, so a square one is a circle. The default theme keeps Fomantic's rounded
  corners on it; <code>circular</code> makes it a circle in every theme.
