<p>
  In a scratch user project, add <code>"targets": ["js/solid", "ts/solid"]</code> to its <code>project.json</code>, then
  <code>spell compile &lt;project&gt;</code> (or save a file in the app).
  <code>&lt;Project&gt;.compiled.ts</code> should appear beside <code>&lt;Project&gt;.compiled.js</code> and
  <code>&lt;Project&gt;.declarations.json</code>; the app still runs the project (it runs the JS).
</p>
