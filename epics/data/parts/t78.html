  A browser's Find can only find what's on the page, so Cmd-F draws the rest first, to 5,000 (about 1.7 s). Past that it
  can't be found. Scrolling to the end of 50,000 is 50,000 elements: nothing's taken down again. Find doesn't read a
  place's later pages either.
