<p>
  <code>FolderPlace</code> and <code>FilePlace</code> hear the disk straight away, and <code>RemotePlace</code> has
  <code>changesSince()</code>, but it has no <code>watch()</code>: nothing pushes to a page yet. The recipe box polls,
  so it follows within 5 seconds. Pushing belongs with Live And Presence, on the kit's websocket, never a held-open
  request.
</p>
