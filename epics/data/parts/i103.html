<p>
  Found by the coherence review for P50. If the place's <code>to complete a job is at ...</code> comes before
  <code>a job is a thing</code>, it compiles to a loose <code>completeAJob()</code>, and
  <code>complete the job</code> doesn't parse. Ingested <code>.api.spell</code> files may hit this, depending on line
  order.
</p>
