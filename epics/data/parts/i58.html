<p>
  <code>return the name of the first of its authors</code> compiled to <code>this.authors.first.name</code>, which is
  <code>undefined</code>: a list has <code>firstItem</code>, not <code>first</code>.
  <code>the first item of its authors</code> compiles to <code>core.getItemAt(..., 0)</code>, as it should. The
  examples' <code>the first of its people who has one</code> is the filtered form, which works.
</p>
