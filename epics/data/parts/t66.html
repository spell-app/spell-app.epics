<p>
  Owen, 2026-10-31: "<code>where its cook is them</code> = <code>where they are the cook</code>". Both forms, one
  meaning: <code>recipes where they are the cook</code>.
</p>
<p>
  Inside a <code>where</code>, <code>they</code> is the person using the program, and <code>the cook</code> is the
  thing's own field, not a program's <code>cook</code>.
</p>
