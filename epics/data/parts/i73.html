<p>
  <code>core.dateShown()</code> uses <code>timeZone: "UTC"</code>; <code>the hour of</code> is <code>getHours()</code>,
  local. Open-Meteo's times have no offset, so they're read as local: west of UTC, a late hour may show the next day's
  date.
</p>
