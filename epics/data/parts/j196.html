<p>
  After an entry with a query, a piece starts a new entry only when it's a path or a name and a path (<code>/x</code>,
  <code>x=/x</code>): <code>hourly=temperature_2m,precipitation</code> stays one. A bare collection name right after a
  query joins it: write it as a path.
</p>
