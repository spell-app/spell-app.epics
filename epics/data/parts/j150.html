<p>
  Spell can't tell an element to do something (<code>play()</code>). So <code>to hear (a pokemon)</code> sets the
  pokedex's <code>hearing</code> to nothing, pauses 50 msec, and sets it to the Pokémon: the app draws
  <code>&lt;audio src=... autoplay /&gt;</code> afresh, which plays after a click.
</p>
