<p>
  Chose to keep <code>core.filter()</code> over what a search brings back, over trusting the server, because a server's
  search may match more loosely (swapi's looks in more than one field on some routes), and a program must get exactly
  what its <code>where</code> says. It costs a pass over the few rows the search returned.
</p>
