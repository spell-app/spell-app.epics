<p>
  The plan names a ceiling but no number, so these defaults are a guess, not a measurement. A place can set its own with
  <code>capabilities.ceiling</code>. Bytes are the length of each row as JSON, so they're approximate. Thousands of rows
  are measured in Gathering Reads (T6).
</p>
