Moving PokeSpell.spellml first would make <code>new Pokedex()</code> before class <code>Guess</code> exists (it holds
<code>a new guess</code>), so it stays last, its comment saying why. <code>guess (a pokemon)</code> as an action would
be a Pokémon's (its typed argument is the thing it runs on), so the button says
<code>set its guessed to choice</code> instead.
