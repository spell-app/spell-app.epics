<p>
  <code>call(CSV_SAVE_ROWS, { rows, from })</code> says out of date if the file moved on since <code>from</code>: with
  no id there's no row to merge on, so it asks for a fresh read. And no program can call it yet: a program's own edit to
  such a row is refused, and says why. A person's only way to edit one is the file.
</p>
