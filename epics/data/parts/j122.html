<p>
  A plain <code>.spell</code> file could reopen a type (<code>a person:</code>), and a <code>.spellml</code> one
  couldn't: it said there's a person already. Chose a tag of its own over letting <code>spell-thing</code> reopen
  quietly, so a type named twice by mistake is still an error. Spanish: <code>encanto-más-de</code>.
</p>
