<p>
  When Spell can't tell what follows, <code>the first of it</code> will read the first item, as
  <code>the first item of it</code> does; a property called <code>first</code> on data of unknown shape needs declaring.
  <code>top</code> and <code>bottom</code>, ordinary property names, count as items only on a known list.
</p>
