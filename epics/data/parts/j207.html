<ul>
  <li>A longer <code>Cache-Control: max-age</code> keeps a copy fresh longer than the check time (PokéAPI's day).</li>
  <li>A <code>no-store</code> keeps nothing, even with the line: the server said never to keep it.</li>
  <li>
    With no check line at all, a kept copy is stale at once: drawn at once, and read again behind it, every visit.
  </li>
</ul>
