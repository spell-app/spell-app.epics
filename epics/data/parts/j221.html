<p>
  Decided: the check follows the names of getters. A getter that calls an action that waits (<code
    >its "score" is: count it</code
  >) is still caught only when the program runs.
</p>
<p>The alternative: have the compiler follow actions a getter calls too, so that case is caught before it runs.</p>
