<p>
  Pending changes show at once on the real thing, which is exactly what a draft must not do. So
  <code>draftOf()</code> makes a scratch copy for the form to change, keeps its changed fields on this device, and
  <code>save()</code> writes them to the real thing as one group. Cancel forgets the copy.
</p>
