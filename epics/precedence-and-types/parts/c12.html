  <code>MethodInfixRule</code> rejects a right side of the wrong type; neither it nor <code>MethodPostfixRule</code> can
  check its LEFT side: a suffix doesn't see it while parsing. Two types with the same quoted alias (<code
    >"is ready"</code
  >) still collide as before -- the earlier rule wins.
