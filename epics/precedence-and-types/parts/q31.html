<epic-answer id="d16" title="A datatype is a string in spell's words"
  ><p>
    <code>text</code>, <code>choice</code>, <code>list of cards</code>; JS words (<code>string</code>,
    <code>boolean</code>, <code>array</code>) accepted only where a user WRITES them. The runtime already speaks these
    (<code>spellCore.typeOf()</code>).
  </p></epic-answer
>
