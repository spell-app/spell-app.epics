<epic-answer id="d33" title="`wait for` gets the same two rules as calls, in P5"
  ><p>
    Bedtime Q3. As a statement: <code>wait for x is 1</code> → <code>await (x == 1)</code>; inside an expression:
    <code>if wait for x is 1</code> → <code>(await x) == 1</code>. Completes <a href="#d28">D28</a>.
  </p></epic-answer
