<epic-answer id="d18" title="Method-call arguments stay full expressions"
  ><p>
    Only operators and prefix rules get bounded operands, so <code>notify x + y</code> keeps working; backtracking stops
    an argument before the next keyword.
  </p></epic-answer
>
