<p>
  <code>it is a heart</code> asks about a suit, unless a type called heart exists anywhere in the project: then it's a
  type check. A 3-line library declaring <code>heart</code> flips Solitaire's card lines 9, 26 and 92; compile and lint
  pass, only the card's tests fail. <code>it is a king</code> in Solitaire's game does the same.
</p>
