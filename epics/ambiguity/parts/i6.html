<p>
  <code>print 1,000</code> compiles to <code>console.log(1, 0)</code>, while <code>set the price to 1,000</code> is an
  error. Spanish sets a decimal comma in its language pack, but the tokenizer never reads it, though README-spanish says
  <code>1,5</code> is a number: <code>imprimir 1,5</code> is <code>console.log(1, 5)</code>.
</p>
