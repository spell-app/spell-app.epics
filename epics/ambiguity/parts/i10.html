<p>
  For the queen of spades: <code>&amp;&amp;</code> gives "queen of spades"; <code>&amp;</code> and <code>+</code> give
  "queenofspades"; <code>its rank and its suit</code> compiles to <code>this.rank &amp;&amp; this.suit</code> and prints
  just "spades"; <code>"queen" and "spades"</code> makes a list. Tic-tac-toe writes <code>+</code>, Checkers
  <code>&amp;&amp;</code>, Solitaire's card both.
</p>
