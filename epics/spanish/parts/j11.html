<p>Both words for "random" are accepted, after the noun:</p>
<ul>
  <li><code>al azar</code>, as in <code>una carta al azar del mazo</code></li>
  <li><code>aleatorio|aleatoria|aleatorios|aleatorias</code>, as in <code>2 cartas aleatorias de L</code></li>
</ul>
