<p>
  Two encodings of <code>é</code> (one code point, or <code>e</code> plus a combining accent) must be one name, or two
  spellings of <code>corazón</code> would be two members. Python normalizes identifiers to NFKC itself; normalizing at
  the tokenizer keeps every writer in step.
