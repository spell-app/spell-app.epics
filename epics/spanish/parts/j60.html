<p><code>the side of play of c</code> takes its words before c's type is known.</p>
<ul>
  <li>so <code>member_words</code> reads a stop-word name if ANY type in scope declares it</li>
  <li>then <code>property_expression</code> still reads only what c's type declares</li>
  <li>on another type it's an error, where it used to be a loose (wrong) read</li>
</ul>
