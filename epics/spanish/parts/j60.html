<p>
  <code>the side of play of c</code> takes its words before <code>c</code>'s type is known, so
  <code>member_words</code> reads a stop-word name if ANY type in scope declares it. Then
  <code>property_expression</code> still reads only what <code>c</code>'s type declares: on another type it's an error,
  where it used to be a loose (wrong) read.
</p>
