<p>
  English and Spanish both pluralize the head noun of a name holding a grammar word:
</p>
<ul>
  <li><code>cards in play</code> names <code>card in play</code></li>
  <li><code>cartas de juego</code> names <code>carta de juego</code></li>
  <li>only for names holding a grammar word:  <code>bank accounts</code> stays plural by its last</li>
</ul>
