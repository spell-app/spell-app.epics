</p>
<ul>
  <li><code>prepend</code>:  <code>anteponer X a L</code></li>
  <li><code>append</code>:  <code>(anexar|adjuntar) X a L</code></li>
  <li>over <code>preponer</code> / <code>añadir al final</code></li>

</ul>
