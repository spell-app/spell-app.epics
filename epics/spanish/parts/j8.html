<p>
  Chose <code>anteponer X a L</code> for <code>prepend</code> and <code>(anexar|adjuntar) X a L</code> for
  <code>append</code>, over <code>preponer</code> / <code>añadir al final</code>, because they're single verbs people
  know; <code>agregar X al principio / al final de L</code> already says both in plainer words.
</p>
