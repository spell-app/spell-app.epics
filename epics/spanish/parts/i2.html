<p>
  In Spanish, <code>para dar la vuelta a una carta:</code> defines <code>darLaVueltaACarta</code>, but the call
  <code>dar la vuelta a la carta</code> compiles to <code>darLaVueltaA(carta)</code>: the definition and the call drop
  the dangling word differently. The cartas fixture says <code>dar vuelta una carta</code> to get round it.
</p>
