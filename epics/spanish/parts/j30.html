<p>English's <code>a cards color is ...</code> (possessive with no apostrophe) has no Spanish form.</p>
<ul>
  <li>Spanish says <code>el color de una carta</code>, which <code>the_property_of_a_thing</code> reads</li>
  <li>so <code>classes.es.ts</code> registers no <code>AThingsProperty</code></li>
  <li>its test is said with <code>el color de una card es ...</code></li>
</ul>
