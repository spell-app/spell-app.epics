<p>
  English's <code>a cards color is ...</code> (possessive with no apostrophe) has no Spanish form: Spanish says
  <code>el color de una carta</code>, which <code>the_property_of_a_thing</code> reads. So
  <code>classes.es.ts</code> registers no <code>AThingsProperty</code>; its test is said with
  <code>el color de una card es ...</code>.
</p>
