<p>
  The outline-body property and getter lines that start with <code>su</code>/<code>sus</code> now take
  <code>(es|son)</code>, as the subject-less forms already did. So <code>sus "comodines" son sí o no</code> reads.
</p>
<ul>
  <li>
    <code>su ... son</code> and <code>sus ... es</code> are accepted too, because number agreement isn't checked here
    (glossary rule 5).
  </li>
</ul>
