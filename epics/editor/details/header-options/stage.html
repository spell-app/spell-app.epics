<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Five header looks, live</title>
    <link rel="stylesheet" href="/components/ui/_assets/site.css" />
    <script type="module" src="/components/ui/_assets/site.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
      }
      .Option {
        display: grid;
        grid-template-columns: 330px 300px 170px;
        gap: 12px;
        align-items: start;
        width: max-content;
        padding: 14px;
      }
      .Option + .Option {
        border-top: 1px solid color-mix(in oklab, currentColor 12%, transparent);
      }
      .Option > h2 {
        grid-column: 1 / -1;
        margin: 0;
        font: 600 13px/1.3 var(--ui-font-sans, system-ui);
      }
      .Card {
        overflow: hidden;
        border-radius: 12px;
        border: 1px solid var(--ui-panel-pane-border-color, color-mix(in oklab, currentColor 14%, transparent));
        background: var(--ui-panel-pane-background, var(--ui-surface));
        -webkit-backdrop-filter: var(--ui-panel-pane-filter, none);
        backdrop-filter: var(--ui-panel-pane-filter, none);
      }
      .Note {
        grid-column: 1 / -1;
        margin: -4px 0 0;
        font: 11px/1.3 var(--ui-font-sans, system-ui);
        opacity: 0.6;
      }
      .Pad {
        display: block;
        height: 118px;
        padding: 8px 12px;
        overflow: hidden;
        font: 12.5px/19px var(--ui-font-mono, ui-monospace, monospace);
        white-space: pre;
        opacity: 0.8;
      }
      .Tree {
        display: block;
        height: 118px;
        margin: 0;
        padding: 6px 10px;
        overflow: hidden;
        font: 13px/22px var(--ui-font-sans, system-ui);
        white-space: nowrap;
        list-style: none;
      }
      .Tree i {
        display: inline-block;
        width: 1.1em;
        font-style: normal;
        opacity: 0.6;
      }
      .Stack {
        display: grid;
        gap: 12px;
      }
      .Narrow {
        grid-column: 3;
        grid-row: 2;
      }

      /* Every option:  the triangle with less padding around it, ahead of the row */
      .Option ui-panel::part(toggle) {
        width: 16px;
        height: 16px;
      }
      .Option ui-panel::part(heading) {
        margin-inline: -2px 0;
      }
      .Option ui-panel::part(title) {
        padding-inline: 5px 8px;
        gap: 4px;
      }
      .Option ui-toolbar {
        min-width: 0;
      }
      .Option ui-toolbar::part(menu) {
        flex: 0 1 auto;
        width: auto;
      }
      .Option ui-item::part(item) {
        flex: 0 0 auto;
      }
      .Option ui-toolbar::part(toolbar) {
        justify-content: space-between;
      }
      .Option ui-panel.NoCaret::part(heading) {
        display: none;
      }

      /* A:  the raised pill, tightened, on the bar with nothing behind it */
      .A ui-toolbar {
        --ui-menu-segmented-header-item-padding: 0.42em 0.7em;
      }
      .A ui-toolbar::part(menu) {
        width: auto;
        gap: 1px;
      }
      
      /* B:  quiet words, the chosen one in the accent over a bar along the pane's hairline */
      .B ui-toolbar {
        --ui-menu-segmented-header-item-padding: 0.42em 0.6em;
        --_b-accent: var(--ui-primary-text, var(--ui-primary));
      }
      .B ui-toolbar::part(menu) {
        width: auto;
        gap: 2px;
      }
            .B ui-toolbar::part(thumb),
      .B ui-toolbar::part(menu)::before,
      .B ui-toolbar::part(menu)::after {
        display: none;
      }
      .B ui-item::part(item) {
        position: relative;
        background: none !important;
        box-shadow: none !important;
        opacity: 0.72;
      }
      .B ui-item[selected]::part(item) {
        color: var(--_b-accent) !important;
        opacity: 1;
        font-weight: 600;
      }
      .B ui-item[selected]::part(item)::after {
        content: "";
        position: absolute;
        inset-inline: 0.6em;
        bottom: -7px;
        height: 2px;
        border-radius: 2px;
        background: var(--_b-accent);
      }

      /* C:  icons only, and the chosen tab says its word */
      .C ui-toolbar {
        --ui-menu-segmented-header-item-padding: 0.42em 0.5em;
      }
      .C ui-toolbar::part(menu) {
        width: auto;
        gap: 1px;
      }
            .C ui-item:not([selected]):has(> ui-icon) {
        font-size: 0;
      }
      .C ui-item:not([selected]):has(> ui-icon) ui-icon {
        font-size: 14px;
        margin: 0;
      }
      .C ui-item:not([selected]):has(> ui-icon)::part(title) {
        gap: 0;
      }

      /* D:  Tahoe:  the tabs in a glass capsule, the tools in a capsule of their own */
      .D ui-toolbar {
        --ui-menu-segmented-header-item-padding: 0.32em 0.7em;
        --ui-menu-segmented-header-background: color-mix(in oklab, currentColor 9%, transparent);
      }
      .D ui-toolbar::part(menu) {
        width: auto;
        padding: 2px;
        box-shadow: inset 0 0.5px 0 color-mix(in oklab, white 30%, transparent);
      }
            .D ui-toolbar::part(right) {
        gap: 8px;
        padding: 4px 10px;
        border-radius: 999px;
        background: color-mix(in oklab, currentColor 9%, transparent);
        box-shadow: inset 0 0.5px 0 color-mix(in oklab, white 30%, transparent);
      }

      /* E:  the chosen one as the bar's title, the rest behind a small menu */
      .E ui-toolbar {
        container-type: normal;
      }
      .E .Title {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 6px;
        border-radius: 7px;
        font: 600 13px/1 var(--ui-font-sans, system-ui);
      }
      .E .Title ui-icon {
        font-size: 13px;
        opacity: 0.8;
      }
      .E .Title .Caret {
        font-size: 9px;
        opacity: 0.6;
      }
      .E .Bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }
      .E .Bar .Tools {
        display: inline-flex;
        gap: 10px;
        padding-inline-end: 2px;
      }
    </style>
  </head>
  <body class="ui-typography">
    <ui-root app>
      <div id="stage"></div>
    </ui-root>
    <script type="module">
      const FILES = ["Card.spellml", "Deck.spellml", "Pile.spellml", "Solitaire.spellml"]
      const VIEWS = [
        ["layer group", "Views"],
        ["cubes", "Things"],
        ["sitemap", "Templates"]
      ]
      const CODE = `# A playing card\n<spell-view "card" draggable>\n  <property "rank" one-of="ace, 2 ... king"/>\n  <property "value">its position</>\n  <alias "is a face card">if its rank is...</>`
      const TREE = `<li><i>▾</i>Solitaire</li><li>&nbsp;&nbsp;<i>▾</i>Container</li><li>&nbsp;&nbsp;&nbsp;&nbsp;<i>▾</i>Menu</li><li>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<i>·</i>Moves: 0</li><li>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<i>·</i>Score: 0</li>`
      const OPTIONS = {
        A: ["A · The raised pill, tightened", "segmented link header"],
        B: ["B · Quiet words, an accent line", "segmented link header"],
        C: ["C · Icons, and the chosen one says its word", "segmented link header"],
        D: ["D · Tahoe:  two glass capsules", "segmented link header"],
        E: ["E · A title, and the rest behind a menu", "segmented link header"]
      }
      const TOOLS = (open) =>
        `<ui-icon slot="right" name="angle double up" link title="Collapse all"></ui-icon><ui-icon slot="right" name="eye slash" link title="Hide"></ui-icon>`
      const tabs = (items) =>
        items
          .map(
            ([icon, word], index) =>
              `<ui-item ${index ? "" : "selected"}>${icon ? `<ui-icon name="${icon}"></ui-icon>` : ""}${word}</ui-item>`
          )
          .join("")
      const fileItems = FILES.map((file) => [undefined, file])
      const toolbar = (option, items, label, tools = "") =>
        option === "E"
          ? `<div slot="actions" class="Bar"><span class="Title">${items[0][0] ? `<ui-icon name="${items[0][0]}"></ui-icon>` : ""}${items[0][1]}<span class="Caret">▾</span></span>${tools ? `<span class="Tools"><ui-icon name="angle double up" link></ui-icon><ui-icon name="eye slash" link></ui-icon></span>` : ""}</div>`
          : `<ui-toolbar slot="actions" appearance="segmented link header" label="${label}">${tabs(items)}${tools}</ui-toolbar>`
      const views = (option, opened = true, id = "") =>
        `<div class="Card" ${id}><ui-panel appearance="pane" collapsible fold-icon="start" ${opened ? "" : 'open="false"'}><span slot="label" class="ui-visually-hidden">Views</span>${toolbar(option, VIEWS, "Views", TOOLS())}<ul class="Tree">${TREE}</ul></ui-panel></div>`
      const files = (option) =>
        `<div class="Card"><ui-panel appearance="pane" class="NoCaret"><span slot="label" class="ui-visually-hidden">Files</span>${toolbar(option, fileItems, "Files")}<span class="Pad">${CODE.replace(/</g, "&lt;")}</span></ui-panel></div>`
      const narrow = (option) =>
        `<div class="Card" style="width:170px"><ui-panel appearance="pane" collapsible fold-icon="start"><span slot="label" class="ui-visually-hidden">Views</span>${option === "E" ? toolbar(option, VIEWS, "Views", TOOLS()) : `<ui-toolbar slot="actions" appearance="segmented link header" shrinkable label="Views">${tabs(VIEWS)}${TOOLS()}</ui-toolbar>`}<ul class="Tree">${TREE}</ul></ui-panel></div>`
      const params = new URLSearchParams(location.search)
      const only = params.get("option")
      document.querySelector("#stage").innerHTML = Object.entries(OPTIONS)
        .filter(([key]) => !only || key === only)
        .map(
          ([key, [title]]) =>
            `<section class="Option ${key}" data-option="${key}"><h2>${title}</h2><div class="Stack">${files(key)}</div><div class="Stack">${views(key)}${views(key, false)}</div>${narrow(key)}</section>`
        )
        .join("")
    </script>
  </body>
</html>
