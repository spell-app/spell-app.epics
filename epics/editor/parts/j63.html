  Q27: only those who may publish can draft. Until atmosphere's roles, <code>ProjectDrafts.mayPublish()</code> says yes
  to this machine's person (<code>SPACES.LOCAL_PERSON</code>), and no to anyone else. Built-in examples too: their
  drafts and versions are git-ignored, so git keeps only what's published.
