<p>
  A slice shows whole lines of the file, so <code>- on click play it</code> shows as it is written, its words repeated
  under the row's heading. A handler with lines under it (<code>- on card dropped:</code>,
  <code>&lt;on click&gt;</code>) shows only those lines.
</p>
