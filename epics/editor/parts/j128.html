<p>
  <code>CodeMirrorTyping</code> imports <code>SpellTyping</code>'s static helpers (<code>indentToAdd()</code>,
  <code>tagBeforeSpace()</code>, <code>opensQuotes()</code>) from its file: it imports Monaco's types only, so no Monaco
  comes with it.
</p>
<p>A real move would lift those pure helpers out of the Monaco folder, so both editors share them by name.</p>
