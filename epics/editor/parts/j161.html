<p>
  The lines are Fomantic's dividers between a selection dropdown's items, the default for every
  <code>&lt;ui-select&gt;</code>.
</p>
<ul>
  <li>
    A compact property editor (the Inspector, the site editor's page form) turns them off (<code
      >--ui-select-item-divider-color: transparent</code
    >).
  </li>
  <li>Forms elsewhere keep them, as Fomantic draws them.</li>
</ul>
