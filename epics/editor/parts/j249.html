  Fit, Phone, Tablet, Desktop, then a width you type in pixels. A device is Spell UI's <code>&lt;ui-device&gt;</code>,
  its own Rotate turning it; what it holds is drawn at its own size, not scaled up. A site's page is the app itself, so
  a size sets the app's width there, with no frame.
