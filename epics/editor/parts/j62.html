<p>
  Drafts apply to the files a project lists (spell, spellml, css, scripts, editor pages): what a person edits. What
  spell builds, and any other file (a <code>.txt</code>, a data file), is written straight to disk. The language server,
  <code>spell compile</code> and VS Code read and write the published files, never drafts.
</p>
