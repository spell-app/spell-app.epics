<p>
  The plan put <code>role=img</code> and the label on the element itself, as <code>&lt;ui-icon&gt;</code> does. An
  image's children are hidden from screen readers, which would hide the <code>controls</code> menu. So the box holding
  the SVG is the image, named the same way (label, else the text's title, else its kind).
</p>
