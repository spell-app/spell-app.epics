<p>
  WWOD §17's "Render pieces as inner functions" is for function components. A
  <code>ui</code> controller class renders pieces as private methods; they're named for what they draw, without the type
  word (WWOD §3): <code>thumb()</code>, not <code>renderThumb()</code> or <code>thumbElement()</code>.
</p>
