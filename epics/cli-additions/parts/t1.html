<p>
  Add <code>spell lsp</code>, which starts the language server, so the VS Code extension spawns
  <code>spell lsp</code> rather than a <code>tsx</code> path.
</p>
<ul>
  <li>
    Skip the CLI's <code>consoleGuard</code> for it: the server has its own <code>stdioGuard</code>, which keeps stray
    output off the protocol.
  </li>
  <li>Run <code>yarn vscode</code> after, to rebuild the extension.</li>
</ul>
