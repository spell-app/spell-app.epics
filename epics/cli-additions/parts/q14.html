<epic-answer id="d13" title="parse / repl lines parse in a scope of their own, inside the project's with --in"
  ><p>
    <code>CLI.lineScope()</code>: a <code>ProjectScope</code> whose parent is the project's, so its types and phrases
    are known but nothing typed lands in the project. <code>repl</code> commits each line there, so
    <code>x is 3</code> then <code>print x</code> works. No rule given: <code>statement</code>, then
    <code>expression</code>; several lines: <code>block</code>.
  </p></epic-answer
>
