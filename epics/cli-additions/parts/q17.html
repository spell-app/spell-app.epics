<epic-answer id="d16" title="watch rebuilds an importer from scratch, as if its project.json changed"
  ><p>
    A compiled import's declarations are only read on a full parse (<code>SpellProject.loadImportScope()</code>), so an
    incremental re-parse wouldn't see them. Only among WATCHED projects. Not after the first build: everything is
    building then anyway.
  </p></epic-answer
>
