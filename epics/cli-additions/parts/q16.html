<epic-answer id="d15" title="Test name filter is --name <text>, not a second positional (CHANGED from the old plan)"
  ><p>
    The old plan said <code>spell test . "deck creation"</code>. But <code>test</code> takes several targets, so a name
    there can't be told from a target. Now: <code>spell test . --name "deck creation"</code>, which
    <code>watch --test</code> takes too.
  </p></epic-answer
>
