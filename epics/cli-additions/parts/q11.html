<epic-answer id="d10" title="Scope-pack test checks content, not byte-identity with the scopes script"
  ><p>
    The <code>scopes</code> script takes a root's project id, not a temp folder. All three writers call
    <code>SpellDiskWorkspace.writeScopes()</code>. By hand:
    <code>spell compile @examples/Solitaire @examples/FizzBuzz @examples/Calculator</code> rewrote their CHECKED-IN
    packs unchanged: byte-identical to the language server's.
  </p></epic-answer
