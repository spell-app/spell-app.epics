  Mockup's and Crisp's raised and floating shadows are none, Pop's raised is an ink sticker: so the page layout draws
  its own soft shadow from <code>--ui-shadow-ink</code> (14% and 22%, two layers), in every theme. A theme or page
  changes it with <code>--ui-page-layout-shadow</code>.
