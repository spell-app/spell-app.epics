<p>
  Spell's measures convert only between units written in the program, so an ingredient's unit (text) picks the sum: g to
  oz, ml to spoons or cups, and back; grams to cups only where the ingredient says its grams per cup (flour 125, red
  lentils 190). Amounts stay a number and a unit.
</p>
