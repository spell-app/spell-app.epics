<p>The site nav now finds the page shown by its link's path AND hash.</p>
<ul>
  <li>
    Before, <code>&lt;ui-site-nav&gt;</code> compared an <code>href</code>'s path alone, so every hash link on one page
    (<code>#/films</code>) counted as the page shown.
  </li>
  <li>A Spell site's addresses have no hash, so nothing changes there.</li>
</ul>
