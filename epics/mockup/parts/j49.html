<p>
  T26 first made every raw-text tag a block of its own, which broke notebooks, whose <code>&lt;markdown&gt;</code> and
  examples side by side are one drawing. So only tags that are never drawn stand alone (<code>standAloneTags</code>,
  spell's <code>["jobs"]</code>): a page's <code>&lt;jobs&gt;</code> with its <code>&lt;markdown&gt;</code> on the next
  line now reads as two blocks.
</p>
