<p>
  Spanish ends a member's name of several words at <code>de</code>, so
  <code>- tiene una página de película en ...</code> reads only <code>página</code>. A site line in Spanish quotes it:
  <code>- tiene una "página de película" en "/peliculas/:película"</code>, as Spanish property names with
  <code>de</code> are quoted already. Both languages take the quoted form.
</p>
