<epic-answer id="d8" title="ui-button forwards commandfor / command, with a support flag"
  ><p>
    Forward both to the inner <code>&lt;button&gt;</code>; add <code>UI.browser.supports.invokers</code>; where
    unsupported, a small JS fallback runs the built-in commands (<code>--show</code>, <code>--close</code>,
    <code>--toggle</code> ...) on the target.
  </p></epic-answer
