<epic-answer id="d33" title="Browsers: grid / items container queries are unnamed"
  ><p>
    WebKit scopes container NAMES to the tree, so a slotted column's shadow tree can't see a host's name. The containers
    keep their names for page CSS. Checked by the visual run.
  </p></epic-answer
>
