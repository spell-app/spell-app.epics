<epic-answer id="d25" title="Decision: ui-button invoker commands (commandfor / command)"
  ><p>
    Forwarded to the inner button (<code>commandForElement</code> resolved from the host root node).
    <code>UI.browser.supports.invokers</code>; without it a JS fallback (<code>Invoker</code>) runs built-ins and
    dispatches <code>command</code>. <code>--toggle</code> added to modal / flyout. Popup, dropdown and toast do not yet
    answer <code>command</code> events (todo).
  </p></epic-answer
>
