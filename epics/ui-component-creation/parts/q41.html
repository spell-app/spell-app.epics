<epic-answer id="d28" title="Layout: card links carry no underline"
  ><p>
    A card's header link and its meta / extra links have <code>text-decoration: none</code> (colour and hover only), as
    in Fomantic (<code>site.less</code> <code>a { text-decoration: none }</code>). Owen's standing preference. Site-wide
    links stay underlined (typography.css); only <code>in-card</code> parts opt out (parts.css).
  </p></epic-answer
>
