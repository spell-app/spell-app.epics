<epic-answer id="d24" title="Decision: modal closable=false restores Fomantic closable:false"
  ><p>
    <code>closable="false"</code> = no close icon AND dismissal <code>none</code>, unless <code>closedby</code> is set
    (wins). <code>closable</code> absent keeps today's behaviour. Fomantic: <code>closable</code> (Escape / dimmer) and
    <code>closeIcon</code> (icon) are separate settings; the vocabulary says which each maps to.
  </p></epic-answer
>
