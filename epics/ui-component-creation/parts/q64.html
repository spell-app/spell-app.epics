<epic-answer id="d64" title="UIElement.eager: an element may render before the runtime and its sheets arrive"
  ><p>
    New <code>@proto static eager</code> (default false). <code>&lt;ui-root&gt;</code> sets it, so the page inside shows
    (or hides, by an inline style on its slot) the moment the root is defined, not after <code>UI.load()</code>. Its
    render must look right unstyled until <code>loaded()</code>.
  </p></epic-answer
>
