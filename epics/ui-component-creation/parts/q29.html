<epic-answer
  id="d16"
  title="Pack builder stays in packages/ui/tools; other packages import it as $/ui/tools/IconPackBuilder"
  ><p>
    New alias <code>$/ui/tools/*</code> in
    <a href="../../../tsconfig.base.json" target="src-tsconfig-base-json"><code>tsconfig.base.json</code></a>
    (longer than <code>$/ui/*</code>, so it wins), listed with the other cross-package entry points. Checked:
    <code>yarn tsx</code> from
    <a href="../../spell-app/src/cli/" target="src-spell-app-src-cli"><code>packages/cli</code></a> loads it. Its relative
    imports of
    <a href="../../spell-ui/src/icons/" target="src-spell-ui-src-icons"><code>src/icons/</code></a>
    resolve from its own file, so nothing moves. Wiring the CLI command stays <a href="#t2">T2</a>.
  </p></epic-answer
>
