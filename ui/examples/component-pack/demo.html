<!doctype html>
<!--
  Hand check for `<ui-components>` (epic `wwod-spell-ui`, P12):  a page whose own component pack (`pack.json`, beside
  this file) names two tags that are NOT `ui-*`;  the root below loads them on demand like any family.
  Not a docs page (`yarn site:check --all` skips `examples/`).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Component pack demo · Spell UI</title>
    <link rel="stylesheet" href="../../_assets/site.css" />
    <script type="module" src="../../_assets/site.js"></script>
  </head>
  <body>
    <main id="main" class="site-main">
      <ui-header level="1">Component pack demo</ui-header>
      <p>
        <code>&lt;ui-components source="pack.json"&gt;</code> below reads a pack of two tags,
        <code>&lt;x-hello-card&gt;</code> (on demand) and <code>&lt;x-hello-badge&gt;</code> (eager), from
        <code>hello.js</code>.  The root under it loads them like any family.
      </p>
      <ui-components source="pack.json"></ui-components>
      <ui-root display="skeleton">
        <x-hello-card name="Owen"></x-hello-card>
        <p>A badge, eager:  <x-hello-badge>new</x-hello-badge></p>
      </ui-root>
    </main>
  </body>
</html>
