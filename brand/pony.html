<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Spell pony</title>
    <meta name="description" content="Sparkle, the Spell pony:  built in Claude Design from real Spell UI elements, brought back with /design pull." />
    <script src="../packages/epics/tools/_assets/spell-ui.js"></script>
    <style>
      @keyframes pony-gallop {
        from { transform: translateY(0) rotate(-2deg) }
        to { transform: translateY(-14px) rotate(2deg) }
      }
      @keyframes pony-sparkle {
        from { opacity: 0.2 }
        to { opacity: 1 }
      }
      #pony.galloping { animation: pony-gallop 0.35s ease-in-out infinite alternate;  transform-origin: 50% 90% }
      .pony-board { max-width: 960px;  margin: 0 auto;  box-sizing: border-box;  padding: 40px 48px;  display: flex;
        flex-direction: column;  gap: 20px }
      .pony-row { display: flex;  flex-wrap: wrap;  gap: 24px;  align-items: stretch }
    </style>
  </head>
  <body class="ui-typography">
    <spell-site-header root=".."></spell-site-header>
    <!-- pulled from Claude Design, https://claude.ai/artifact/V9ECVy3mCdUNmrksk648wF, board Main.dc.html, 2026-10-05;
         its holes filled with starting values and its handlers moved into the script at the end (epic claude-design, P10) -->
    <ui-root>
      <div class="pony-board">
        <header style="display: flex; flex-direction: column; gap: 6px">
          <div style="font: 500 12px/1 ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ui-primary)">Brand · a pony</div>
          <h1 style="margin: 0; font: 700 40px/1.05 Palatino, 'Palatino Linotype', serif">Meet the Spell pony.</h1>
          <p style="margin: 0; font: italic 400 17px/1.5 Palatino, 'Palatino Linotype', serif; color: var(--ui-text-muted, #5b5470)">
            Every hoof a real Spell UI element, drawn in Claude Design.
          </p>
        </header>
        <div class="pony-row">
          <ui-segment style="flex: 1 1 420px; display: flex; align-items: center; justify-content: center">
            <svg id="pony" viewBox="0 0 320 240" width="440" height="330" style="max-width: 100%; height: auto" role="img" aria-label="A pony in a wizard hat">
              <g style="animation: pony-sparkle 0.9s ease-in-out infinite alternate">
                <path d="M246 22 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="#f4c542" />
                <path d="M286 64 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z" fill="#f4c542" />
              </g>
              <ellipse cx="150" cy="150" rx="78" ry="44" fill="#ece7fb" stroke="#2a1d60" stroke-width="4" />
              <rect x="96" y="178" width="14" height="44" rx="6" fill="#ece7fb" stroke="#2a1d60" stroke-width="4" />
              <rect x="122" y="182" width="14" height="42" rx="6" fill="#ece7fb" stroke="#2a1d60" stroke-width="4" />
              <rect x="168" y="182" width="14" height="42" rx="6" fill="#ece7fb" stroke="#2a1d60" stroke-width="4" />
              <rect x="194" y="178" width="14" height="44" rx="6" fill="#ece7fb" stroke="#2a1d60" stroke-width="4" />
              <path class="mane" d="M76 140 C 50 150 42 178 56 196" fill="none" stroke="#7b68e9" stroke-width="12" stroke-linecap="round" />
              <path d="M206 128 L 232 70 L 262 84 L 240 138 Z" fill="#ece7fb" stroke="#2a1d60" stroke-width="4" stroke-linejoin="round" />
              <ellipse cx="258" cy="84" rx="30" ry="22" fill="#ece7fb" stroke="#2a1d60" stroke-width="4" />
              <circle cx="264" cy="78" r="4" fill="#2a1d60" />
              <circle cx="282" cy="92" r="2.5" fill="#2a1d60" />
              <path class="mane" d="M222 76 C 212 96 210 116 216 134" fill="none" stroke="#7b68e9" stroke-width="10" stroke-linecap="round" />
              <path d="M230 62 L 250 6 L 270 62 Z" fill="#503ca8" stroke="#2a1d60" stroke-width="4" stroke-linejoin="round" />
              <ellipse cx="250" cy="62" rx="30" ry="7" fill="#7b68e9" stroke="#2a1d60" stroke-width="4" />
              <path d="M250 22 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z" fill="#f4c542" />
            </svg>
          </ui-segment>
          <div style="flex: 0 1 300px; display: flex; flex-direction: column; gap: 16px">
            <ui-card>
              <ui-content>
                <ui-header>Sparkle</ui-header>
                <ui-meta>Spell's pony, first of her name</ui-meta>
                <ui-description>Likes:  grammatical source code, oats, custom elements.</ui-description>
              </ui-content>
              <ui-content extra="">
                <ui-rating icon="heart" max-rating="5" value="5" color="pink"></ui-rating>
              </ui-content>
            </ui-card>
            <ui-statistics size="small">
              <ui-statistic id="gallops" value="0" label="Gallops"></ui-statistic>
              <ui-statistic id="neighs" value="0" label="Neighs"></ui-statistic>
            </ui-statistics>
            <div style="display: flex; flex-wrap: wrap; gap: 8px">
              <ui-button id="gallop" primary icon="horse">Gallop</ui-button>
              <ui-button id="recolor" icon="palette">New mane</ui-button>
              <ui-button id="neigh" basic icon="comment">Neigh</ui-button>
            </div>
            <ui-message id="saying" state="info" header="Sparkle says" hidden>
              <p></p>
            </ui-message>
          </div>
        </div>
      </div>
    </ui-root>
    <script>
      // The board's renderVals(), as plain DOM:  Gallop toggles the bounce, New mane cycles colours, Neigh speaks.
      ;(() => {
        const MANES = ["#7b68e9", "#e05aa8", "#f4a52a", "#2fa6a0", "#503ca8"]
        const SAYINGS = [
          "Spell it, and it shall be.",
          "Neigh-tive custom elements, at your service.",
          "I was built in Claude Design.",
          "Every hoof a <ui-*> element."
        ]
        const $ = (id) => document.getElementById(id)
        let gallops = 0
        let neighs = 0
        let mane = 0
        $("gallop").addEventListener("click", () => {
          const galloping = $("pony").classList.toggle("galloping")
          $("gallop").textContent = galloping ? "Whoa" : "Gallop"
          if (galloping) $("gallops").setAttribute("value", String(++gallops))
        })
        $("recolor").addEventListener("click", () => {
          mane = (mane + 1) % MANES.length
          for (const path of document.querySelectorAll("#pony .mane")) path.setAttribute("stroke", MANES[mane])
        })
        $("neigh").addEventListener("click", () => {
          $("neighs").setAttribute("value", String(++neighs))
          $("saying").querySelector("p").textContent = SAYINGS[(neighs - 1) % SAYINGS.length]
          $("saying").hidden = false
        })
      })()
    </script>
  </body>
</html>
