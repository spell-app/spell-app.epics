<!doctype html>
<!--
  Sparkle, the Spell pony, from Claude Design (epic claude-design, P10), galloping since epic property-editor P8.
  - Her drawing is painted back to front:  the far legs, the near legs, then the body over the tops of all four,
    so no leg's top shows over her belly however it swings.
  - Each leg is its own group, turning at its hip (its `transform-origin`, in the drawing's units);  while she
    gallops the back pair and the front pair swing half a stride apart, each pair's far leg a little behind its near
    one, and her whole body bobs once a stride.
  - Her settings are a `<ui-property-editor>` bound to one object, `pony`:  every change redraws her.
    It needs the brand bundle of a checkout that has the property editor (epic property-editor, merged).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Spell pony</title>
    <meta name="description" content="Sparkle, the Spell pony:  built in Claude Design from real Spell UI elements, galloping, with a property editor of her own." />
    <link rel="stylesheet" href="../packages/brand/_assets/ui/brand-ui.css" />
    <script type="module" src="../packages/brand/_assets/ui/brand-ui.js"></script>
    <style>
      @keyframes pony-stride {
        from { transform: rotate(26deg) }
        to { transform: rotate(-26deg) }
      }
      @keyframes pony-bob {
        from { transform: translateY(0) }
        to { transform: translateY(-9px) }
      }
      @keyframes pony-sparkle {
        from { opacity: 0.2 }
        to { opacity: 1 }
      }
      body { margin: 0;  background: var(--ui-background) }
      /* one stride, in seconds:  the script sets it from her speed */
      #pony { --stride: 0.4s }
      #pony .leg { transform-box: view-box }
      #pony.galloping .leg { animation: pony-stride var(--stride) ease-in-out infinite alternate }
      #pony.galloping .back.far { animation-delay: calc(var(--stride) * -0.3) }
      #pony.galloping .front.near { animation-delay: calc(var(--stride) * -1) }
      #pony.galloping .front.far { animation-delay: calc(var(--stride) * -1.3) }
      #pony.galloping .bob { animation: pony-bob calc(var(--stride) / 2) ease-in-out infinite alternate }
      .pony-board { max-width: 960px;  margin: 0 auto;  box-sizing: border-box;  padding: 40px 48px;  display: flex;
        flex-direction: column;  gap: 20px }
      .pony-row { display: flex;  flex-wrap: wrap;  gap: 24px;  align-items: flex-start }
      /* she stays in sight while her settings scroll */
      .pony-stage { flex: 1 1 420px;  display: flex;  align-items: center;  justify-content: center;  position: sticky;  top: 64px }
    </style>
  </head>
  <body class="ui-typography">
    <spell-site-header root=".."></spell-site-header>
    <!-- pulled from Claude Design, https://claude.ai/artifact/V9ECVy3mCdUNmrksk648wF, board Main.dc.html, 2026-10-05;
         its holes filled with starting values and its handlers moved into the script at the end (epic claude-design, P10) -->
    <ui-root>
      <div class="pony-board">
        <header style="display: flex; flex-direction: column; gap: 6px">
          <div style="font: 500 12px/1 ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ui-primary)">Brand · a pony</div>
          <h1 style="margin: 0; font: 700 40px/1.05 Palatino, 'Palatino Linotype', serif">Meet the Spell pony.</h1>
          <p style="margin: 0; font: italic 400 17px/1.5 Palatino, 'Palatino Linotype', serif; color: var(--ui-text-muted, #5b5470)">
            Every hoof a real Spell UI element, drawn in Claude Design.
          </p>
        </header>
        <div class="pony-row">
          <ui-segment class="pony-stage">
            <svg id="pony" viewBox="0 0 320 240" width="440" height="330" style="max-width: 100%; height: auto" role="img" aria-label="Sparkle, a pony in a wizard hat">
              <g style="animation: pony-sparkle 0.9s ease-in-out infinite alternate">
                <path d="M246 22 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="#f4c542" />
                <path d="M286 64 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z" fill="#f4c542" />
              </g>
              <g class="bob">
                <!-- back to front:  the far legs, the near legs, then the body over the tops of all four -->
                <g class="leg back far" style="transform-origin: 129px 180px">
                  <rect x="122" y="160" width="14" height="64" rx="6" fill="#d6cdf4" stroke="#2a1d60" stroke-width="4" />
                  <rect x="122" y="214" width="14" height="10" rx="4" fill="#503ca8" stroke="#2a1d60" stroke-width="4" />
                </g>
                <g class="leg front far" style="transform-origin: 175px 180px">
                  <rect x="168" y="160" width="14" height="64" rx="6" fill="#d6cdf4" stroke="#2a1d60" stroke-width="4" />
                  <rect x="168" y="214" width="14" height="10" rx="4" fill="#503ca8" stroke="#2a1d60" stroke-width="4" />
                </g>
                <g class="leg back near" style="transform-origin: 103px 178px">
                  <rect x="96" y="158" width="14" height="64" rx="6" fill="#ece7fb" stroke="#2a1d60" stroke-width="4" />
                  <rect x="96" y="212" width="14" height="10" rx="4" fill="#503ca8" stroke="#2a1d60" stroke-width="4" />
                </g>
                <g class="leg front near" style="transform-origin: 201px 178px">
                  <rect x="194" y="158" width="14" height="64" rx="6" fill="#ece7fb" stroke="#2a1d60" stroke-width="4" />
                  <rect x="194" y="212" width="14" height="10" rx="4" fill="#503ca8" stroke="#2a1d60" stroke-width="4" />
                </g>
                <ellipse cx="150" cy="150" rx="78" ry="44" fill="#ece7fb" stroke="#2a1d60" stroke-width="4" />
                <path class="mane" d="M76 140 C 50 150 42 178 56 196" fill="none" stroke="#7b68e9" stroke-width="12" stroke-linecap="round" />
                <path d="M206 128 L 232 70 L 262 84 L 240 138 Z" fill="#ece7fb" stroke="#2a1d60" stroke-width="4" stroke-linejoin="round" />
                <ellipse cx="258" cy="84" rx="30" ry="22" fill="#ece7fb" stroke="#2a1d60" stroke-width="4" />
                <circle cx="264" cy="78" r="4" fill="#2a1d60" />
                <circle cx="282" cy="92" r="2.5" fill="#2a1d60" />
                <path class="mane" d="M222 76 C 212 96 210 116 216 134" fill="none" stroke="#7b68e9" stroke-width="10" stroke-linecap="round" />
                <g class="hat">
                  <path d="M230 62 L 250 6 L 270 62 Z" fill="#503ca8" stroke="#2a1d60" stroke-width="4" stroke-linejoin="round" />
                  <ellipse cx="250" cy="62" rx="30" ry="7" fill="#7b68e9" stroke="#2a1d60" stroke-width="4" />
                  <path d="M250 22 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z" fill="#f4c542" />
                </g>
              </g>
            </svg>
          </ui-segment>
          <div style="flex: 0 1 300px; display: flex; flex-direction: column; gap: 16px">
            <ui-card>
              <ui-content>
                <ui-header id="name">Sparkle</ui-header>
                <ui-meta>Spell's pony, first of her name</ui-meta>
                <ui-description>Likes:  grammatical source code, oats, custom elements.</ui-description>
              </ui-content>
              <ui-content extra="">
                <ui-rating icon="heart" max-rating="5" value="5" color="pink"></ui-rating>
              </ui-content>
            </ui-card>
            <ui-statistics size="small">
              <ui-statistic id="gallops" value="0" label="Gallops"></ui-statistic>
              <ui-statistic id="neighs" value="0" label="Neighs"></ui-statistic>
            </ui-statistics>
            <div style="display: flex; flex-wrap: wrap; gap: 8px">
              <ui-button id="gallop" primary icon="horse">Gallop</ui-button>
              <ui-button id="recolor" icon="palette">New mane</ui-button>
              <ui-button id="neigh" basic icon="comment">Neigh</ui-button>
            </div>
            <ui-message id="saying" state="info" header="Sparkle says" hidden>
              <p></p>
            </ui-message>
            <ui-property-editor
              id="pony-editor"
              header="Her settings"
              schema='{"name": "Pony", "attributes": [
                {"name": "name", "kind": "string", "type": "text", "description": "", "tip": "What she answers to."},
                {"name": "galloping", "kind": "boolean", "type": "boolean", "description": "", "tip": "Off, she stands."},
                {"name": "speed", "kind": "number", "type": "number", "min": 1, "max": 10, "step": 1, "label": "Gallop speed",
                  "description": "", "tip": "1 is a trot, 10 a dash."},
                {"name": "mane", "kind": "enum", "type": "choice", "values": ["lavender", "rose", "marigold", "teal", "indigo"],
                  "description": "", "tip": "Her mane and tail."},
                {"name": "hat", "kind": "boolean", "type": "boolean", "label": "Wizard hat", "description": "", "tip": "The Spell wizard hat, star and all."}
              ]}'
            >
              <ui-property name="name"></ui-property>
              <ui-property-group header="Gallop" collapsible>
                <ui-property name="galloping" as="toggle"></ui-property>
                <ui-property name="speed" as="range"></ui-property>
              </ui-property-group>
              <ui-property-group header="Look" collapsible>
                <ui-property name="mane"></ui-property>
                <ui-property name="hat" as="toggle"></ui-property>
              </ui-property-group>
            </ui-property-editor>
          </div>
        </div>
      </div>
    </ui-root>
    <script type="module">
      // Her settings are one object, `pony`, which the property editor edits;  `draw()` puts it on the page.
      // The buttons are the board's renderVals(), as plain DOM:  Gallop, New mane and Neigh change her too.
      const MANES = { lavender: "#7b68e9", rose: "#e05aa8", marigold: "#f4a52a", teal: "#2fa6a0", indigo: "#503ca8" }
      const SAYINGS = [
        "Spell it, and it shall be.",
        "Neigh-tive custom elements, at your service.",
        "I was built in Claude Design.",
        "Every hoof a <ui-*> element."
      ]
      const $ = (id) => document.getElementById(id)
      const editor = $("pony-editor")
      let pony = { name: "Sparkle", galloping: false, speed: 4, mane: "lavender", hat: true }
      let gallops = 0
      let neighs = 0

      /** Her drawing, card and Gallop button, as `pony` says;  a gallop just started counts. */
      function draw() {
        const svg = $("pony")
        if (pony.galloping && !svg.classList.contains("galloping")) $("gallops").setAttribute("value", String(++gallops))
        svg.classList.toggle("galloping", pony.galloping)
        // speed 1 => a 1s stride, 4 => 0.4s, 10 => 0.18s
        svg.style.setProperty("--stride", `${(2 / (Number(pony.speed) + 1)).toFixed(2)}s`)
        for (const path of svg.querySelectorAll(".mane")) path.setAttribute("stroke", MANES[pony.mane] ?? MANES.lavender)
        svg.querySelector(".hat").setAttribute("visibility", pony.hat ? "visible" : "hidden")
        const name = pony.name.trim() || "Sparkle"
        $("name").textContent = name
        $("saying").setAttribute("header", `${name} says`)
        svg.setAttribute("aria-label", `${name}, a pony${pony.hat ? " in a wizard hat" : ""}`)
        $("gallop").textContent = pony.galloping ? "Whoa" : "Gallop"
        document.querySelector("ui-property[name=speed]").setAttribute("output", `${pony.speed} / 10`)
      }

      /** Change `pony` from outside the editor:  the editor shows the change too. */
      function change(changes) {
        pony = { ...pony, ...changes }
        editor.value = pony
        draw()
      }

      await customElements.whenDefined("ui-property-editor")
      editor.value = pony
      editor.addEventListener("ui-change", () => {
        pony = editor.value
        draw()
      })
      $("gallop").addEventListener("click", () => change({ galloping: !pony.galloping }))
      $("recolor").addEventListener("click", () => {
        const names = Object.keys(MANES)
        change({ mane: names[(names.indexOf(pony.mane) + 1) % names.length] })
      })
      $("neigh").addEventListener("click", () => {
        $("neighs").setAttribute("value", String(++neighs))
        $("saying").querySelector("p").textContent = SAYINGS[(neighs - 1) % SAYINGS.length]
        $("saying").hidden = false
      })
      draw()
    </script>
  </body>
</html>
